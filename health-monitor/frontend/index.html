<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Monitor Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #667eea;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .status {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        .metric {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .metric-value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .alert {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateX(-20px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .alert.critical {
            background: #fee;
            border-left: 4px solid #dc2626;
        }

        .alert.high {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
        }

        .alert.medium {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
        }

        .login-form {
            max-width: 400px;
            margin: 100px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 1rem;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background: #5568d3;
        }

        #dashboard {
            display: none;
        }
    </style>
</head>

<body>
    <div id="login" class="login-form">
        <h1 style="text-align: center; margin-bottom: 30px;">Health Monitor</h1>
        <input type="text" id="username" placeholder="Username" />
        <input type="password" id="password" placeholder="Password" />
        <button onclick="login()">Login</button>
        <button onclick="register()">Register</button>
        <p id="error" style="color: red; margin-top: 10px;"></p>
    </div>

    <div id="dashboard" class="container">
        <div class="header">
            <h1>🏥 Health Monitor</h1>
            <div class="status">
                <div class="status-dot"></div>
                <span>Live Monitoring Active</span>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>📊 Latest Vitals</h2>
                <div id="vitals"></div>
            </div>
            <div class="card">
                <h2>⚠️ Active Alerts</h2>
                <div id="alerts"></div>
            </div>
        </div>

        <div class="card">
            <h2>📈 Heart Rate Trend</h2>
            <canvas id="chart"></canvas>
        </div>
    </div>

    <script>
        let token = null;
        let userId = null;
        let ws = null;
        const API_URL = 'http://localhost:8000';
        const WS_URL = 'ws://localhost:8000';

        let vitalsData = {}; // Store latest value for each metric
        let heartRateHistory = [];

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const formData = new FormData();
            formData.append('username', username);
            formData.append('password', password);

            try {
                const res = await fetch(`${API_URL}/auth/token`, {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    token = data.access_token;
                    userId = data.user_id;
                    await loadDashboard();
                } else {
                    document.getElementById('error').textContent = data.detail;
                }
            } catch (e) {
                document.getElementById('error').textContent = 'Connection error';
            }
        }

        async function register() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    token = data.access_token;
                    userId = data.user_id;
                    await loadDashboard();
                } else {
                    document.getElementById('error').textContent = data.detail;
                }
            } catch (e) {
                document.getElementById('error').textContent = 'Connection error';
            }
        }

        async function loadDashboard() {
            document.getElementById('login').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';

            // Fetch initial vitals
            const res = await fetch(`${API_URL}/vitals`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const history = await res.json();

            // Populate state from history
            history.reverse().forEach(v => {
                vitalsData[v.metric] = v.value;
                if (v.metric === 'heart_rate') {
                    heartRateHistory.push({ t: new Date(v.timestamp), v: v.value });
                }
            });

            renderVitals();
            setupChart();

            // Fetch and display existing alerts from DB
            try {
                const alertRes = await fetch(`${API_URL}/alerts`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (alertRes.ok) {
                    const existingAlerts = await alertRes.json();
                    existingAlerts.forEach(a => handleAlert(a));
                }
            } catch (e) {
                console.warn('Could not load existing alerts:', e);
            }

            setupWebSocket();
        }

        function setupChart() {
            const ctx = document.getElementById('chart').getContext('2d');
            window.chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: heartRateHistory.map(h => h.t.toLocaleTimeString()),
                    datasets: [{
                        label: 'Heart Rate',
                        data: heartRateHistory.map(h => h.v),
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        fill: true,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: { beginAtZero: false, min: 40, max: 160 }
                    }
                }
            });
        }

        function setupWebSocket() {
            ws = new WebSocket(`${WS_URL}/ws/vitals/${userId}`);

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'vital') {
                    handleVital(msg.data);
                } else if (msg.type === 'alert') {
                    handleAlert(msg.data);
                }
            };

            ws.onclose = () => {
                console.log('WS closed. Retrying...');
                setTimeout(setupWebSocket, 3000);
            };
        }

        function handleVital(vital) {
            vitalsData[vital.metric] = vital.value;
            renderVitals();

            if (vital.metric === 'heart_rate') {
                updateChart(vital.value);
            }
        }

        function handleAlert(alert) {
            const container = document.getElementById('alerts');
            const alertEl = document.createElement('div');
            alertEl.className = `alert ${alert.severity}`;
            alertEl.innerHTML = `
                <strong>${alert.severity.toUpperCase()}</strong>: ${alert.message}
                <div style="font-size: 0.8rem; color: #666;">${new Date().toLocaleTimeString()}</div>
            `;
            container.prepend(alertEl);

            // Limit to last 5 alerts
            if (container.children.length > 5) {
                container.removeChild(container.lastChild);
            }
        }

        function renderVitals() {
            const container = document.getElementById('vitals');
            container.innerHTML = Object.entries(vitalsData).map(([metric, value]) => `
                <div class="metric">
                    <span style="text-transform: capitalize;">${metric.replace('_', ' ')}</span>
                    <span class="metric-value">${value}</span>
                </div>
            `).join('');
        }

        function updateChart(value) {
            if (!window.chart) return;

            const time = new Date().toLocaleTimeString();
            window.chart.data.labels.push(time);
            window.chart.data.datasets[0].data.push(value);

            // Keep last 20 points
            if (window.chart.data.labels.length > 20) {
                window.chart.data.labels.shift();
                window.chart.data.datasets[0].data.shift();
            }

            window.chart.update('none'); // Update without animation for performance
        }
    </script>
</body>

</html>
