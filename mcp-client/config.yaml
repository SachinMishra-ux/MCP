servers:
  filesystem:
    type: stdio
    description: Browse local files and folders
    enabled: true
    command:
    - ../.venv/bin/python
    - server.py
    cwd: ../filesystem-server
  email-copilot-local:
    type: stdio
    description: "Email Copilot \u2014 local instance"
    enabled: true
    command:
    - ../.venv/bin/python
    - server.py
    cwd: ../email-copilot
  health-monitor:
    type: stdio
    description: Health vitals monitor MCP server
    enabled: true
    command:
    - ../../.venv/bin/python
    - server.py
    cwd: ../health-monitor/mcp-server
