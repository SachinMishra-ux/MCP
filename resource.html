# 📘 Model Context Protocol (MCP): Foundations

## 1. What Is MCP?

### Why This Concept Exists
Large language models (LLMs) like Claude and others are very capable at reasoning and generating text, but they *do not* natively have access to real-time external data, tools, databases, or applications unless explicitly wired in by developers. This limitation creates a major drawback: AI systems struggle to perform actions or fetch live information without custom, brittle integrations. MCP was introduced to solve exactly that problem. :contentReference[oaicite:0]{index=0}

### Purpose
Model Context Protocol (MCP) is an **open specification and open-source standard** that defines a consistent way for large language models to discover, access, and interact with external tools and data sources via standardized interfaces. It functions like a *universal connector* or “USB-C for LLMs” — enabling AI applications to interact with any compliant resource without bespoke integrations. :contentReference[oaicite:1]{index=1}

### What Problem It Solves
Without MCP, each model and tool pairing requires custom connection code. If a system has N models and M external systems, that means N×M integrations — which is costly and fragile in practice. MCP collapses this by providing one common protocol that all models and tools can use, thus reducing duplication and improving scalability. :contentReference[oaicite:2]{index=2}

## 2. Why MCP — The N×M Integration Problem

### Why This Concept Is Important
Traditional integrations rely on bespoke API adapters for each service the model may use. When the number of services or models increases, the cost and complexity grow rapidly. This usually manifests in:

- Hard-coded tool integrations
- Fragile maintenance when APIs change
- Siloed tool stacks

MCP provides a standard that all tools can advertise their capabilities in a uniform way so the model doesn’t require custom code for every new integration. :contentReference[oaicite:3]{index=3}

### Purpose
MCP is designed so LLMs can *dynamically discover* available tools and services at runtime without requiring updates to the core application code for every new integration. :contentReference[oaicite:4]{index=4}

### What Problem It Solves
It eliminates the need to build custom adapters for each service, reducing engineering effort, lowering maintenance costs, and enabling *plug-and-play tool connectivity* across any compliant system. :contentReference[oaicite:5]{index=5}

## 3. MCP vs Traditional API Integrations

### Why Compare This
Software has long relied on **REST APIs, SDKs, and RPC mechanisms** to connect systems. While these work for many purposes, they lack a unified discovery and invocation mechanism optimized for AI agentic workflows — particularly when it comes to *dynamically discovering tools and capabilities* at runtime.

### Purpose of MCP
Unlike traditional integrations, MCP:

- Standardizes tool discovery instead of expecting the developer to hard-code endpoints.
- Provides a common request/response semantic via JSON-RPC.
- Allows LLMs to *invoke services directly with structured calls*.

This makes systems more modular and dynamic. :contentReference[oaicite:6]{index=6}

### What Problem It Solves
It overcomes the brittleness of conventional API integrations by making external capabilities available to models via standard protocols, reducing duplicated effort and enabling *runtime tool discovery and invocation*. :contentReference[oaicite:7]{index=7}

## 4. High-Level MCP Architecture

The MCP architecture is split into three primary components: the **Host**, the **Client**, and the **Server**. Each plays a distinct role in enabling models to interact with tools and data. :contentReference[oaicite:8]{index=8}

### A. MCP Host

The *MCP Host* is the environment where the AI model and MCP client live. It is responsible for user interaction, session management, orchestration of tool calls, and user interface logic. Examples include desktop AI apps, chat UIs, IDE plugins, or other AI embedded interfaces. :contentReference[oaicite:9]{index=9}

```mermaid
graph LR
    H[MCP Host] -->|Contains| C[MCP Client]
    C <-->|JSON-RPC| S[MCP Server]
    S -->|Wraps| R[Resource / Tool / API]
```

---

### B. MCP Client

The *MCP Client* is part of the host that communicates with one or more *MCP Servers* to:

- Discover available tools
- Invoke tools
- Format responses back to the AI model

The client speaks the MCP protocol (usually over JSON-RPC) and maintains sessions for efficient communication. :contentReference[oaicite:10]{index=10}

---

### C. MCP Server

An *MCP Server* exposes tools, resources, or actions that the model may call. Internally, these are often wrappers over actual APIs, databases, or workflows, but to the MCP client they present standard metadata, input schemas, and execution logic.

Each server publishes:

- Skills and capabilities it supports
- Metadata about those tools
- Invocation interfaces

This allows models to interact with systems without needing embedded knowledge of their underlying APIs. :contentReference[oaicite:11]{index=11}

---

## 5. Protocol and Message Transport

MCP uses **JSON-RPC 2.0** for structured communication between clients and servers. Messages can be transported over multiple mechanisms such as:

- Standard I/O (stdio) — often used for local embedded servers
- HTTP with SSE (Server-Sent Events) — for remote or streaming interactions

JSON-RPC provides:
- Standardized request and response formats
- Uniform error handling
- Structured execution semantics :contentReference[oaicite:12]{index=12}

## 8. 🆚 MCP vs Function Calling

### 1. Core Focus

#### Function Calling
**Deals with *what* action or tool the model should invoke and *when* it should be invoked.**

In practice, a model generates a structured call to a specific function or tool — essentially telling the host: “Call this API/function with these parameters.” This is model-centric and immediate, mainly focused on executing specific tasks.

#### MCP (Model Context Protocol)
**Focuses on *how* tools are served, discovered, and invoked in a standardized ecosystem.**

It isn’t just about executing one function — it defines a protocol for discovery, capability negotiation, invocation, and standardized responses across many tools and services. MCP enables models to interact with a whole ecosystem of tools through a universal interface.

### Summary
- **Function calling** answers: *“Call this function.”*
- **MCP** answers: *“Here’s how all your tools and services are made available, discovered, and called consistently.”*

```mermaid
graph TD
    subgraph "Function Calling (The Action)"
    Model -- "Call tool(args)" --> Host
    Host -- "Execute specific code" --> Tool
    end

    subgraph "MCP (The Protocol & Ecosystem)"
    MCP_Client[MCP Client] -- "List Tools?" --> MCP_Server[MCP Server]
    MCP_Server -- "Here are Tools A, B, C" --> MCP_Client
    MCP_Client -- "Call Tool A(schema)" --> MCP_Server
    MCP_Server -- "Execute Standardized Logic" --> MCP_Tool[Tool Implementation]
    end
```

## 9. �️ MCP Architecture Components (CampusX Context)

Based on the CampusX "MCP Architecture" insights, the ecosystem is built on a strict **Host-Client-Server** model, designed to be modular and secure.

### 1. MCP Host (The "Brain" / Application)

    - Decides *when* to execute a tool based on user intent.

### 2. MCP Client (The "Connector")
- **Definition**: The internal protocol handler within the Host.
- **Role**:
    - Maintains 1:1 connections with MCP Servers.
    - Negotiates capabilities (what tools are available?).
    - Handles the request/response lifecycle.
- **Key Function**: It bridges the gap between the chaotic world of the LLM and the structured world of the Servers.

### 3. MCP Server (The "Provider")
- **Definition**: A lightweight service that exposes specific capabilities to the application.
- **Three Main Primitives**:
    - **Resources**: Data sources (reading files, logs, database rows) — *passive context*.
    - **Prompts**: Pre-written templates for specific tasks — *standardized interactions*.
    - **Tools**: Executable functions (API calls, computations) — *active actions*.
- **Role**: It wraps the external world (an API, a DB, a local file) into a standardized format the Client understands.

### 4. Transport Layer (The "Pipe")
The video emphasizes two main transport mechanisms:
- **Stdio (Standard I/O)**: Ideal for local tools. The Host runs the Server as a subprocess and talks via standard input/output. Fast and secure for local files.
- **SSE (Server-Sent Events)**: Used for remote interactions. Allows keeping a connection open for streaming updates, essential for real-time applications.

## 10. 🧠 Why MCP Uses JSON-RPC (Not Just JSON)

At first glance, JSON alone is a structured format — so why not just send raw JSON? The answer lies in how MCP needs to organize communication, not just data format.

### 1. JSON is a Data Format, Not a Protocol
JSON by itself is just a way to represent structured data — similar to XML or YAML. It doesn’t define *how* messages should be exchanged, identified, or responded to — it just defines the shape of data. To turn JSON into a communication protocol, you need additional structure and rules. Plain JSON doesn’t specify:
- Which messages are requests vs. responses.
- How to match a response back to the original caller.
- How to represent errors, notifications, or method names.
- How to support bi-directional calls.

**JSON-RPC fills those gaps** by defining the semantics of remote calls using JSON as the underlying format.

### 2. JSON-RPC Gives Structured Method Invocation Semantics
MCP isn’t just about sending data — it’s about calling procedures in servers from a client. JSON-RPC defines remote procedure call semantics using JSON, with clearly defined fields like:

```json
{
  "jsonrpc": "2.0",
  "id": 1,
  "method": "tools/call",
  "params": { ... }
}
```

This adds meaning that pure JSON lacks:
- **Method Name**: The specific action the server should invoke.
- **Unique ID**: To track request/response pairs.
- **Param/Result Structure**: A clear way to pass arguments and get data back.

Without JSON-RPC, MCP would need its own ad-hoc message conventions — which both duplicates effort and reduces interoperability.

### 3. Message Lifecycle & Response Matching
When the client sends a request, the server must eventually send a response — and the system needs a way to match that response back to the original request.
- **JSON by itself** cannot do this — it doesn’t define an ID field or response structure.
- **JSON-RPC defines**:
    - `id`: Used to match responses to requests.
    - `result`: The successful return data.
    - `error`: Error information if the call failed.

This is essential for structured communication, especially when you have multiple calls in flight or asynchronous messages.

### 4. Consistency Across Transports
MCP isn’t tied to any single transport method — it can run over:
- Standard input/output (stdio)
- HTTP or HTTPS
- Server-Sent Events (SSE)

JSON-RPC provides the uniform structure that stays the same regardless of which transport is used. Without JSON-RPC, MCP would need separate serialization rules per transport, complicating implementations.

### 5. Rich Message Types
JSON-RPC supports:
- ✔ **Request messages** (expect responses)
- ✔ **Notifications** (don’t require a response)
- ✔ **Batch requests** (multiple calls at once)

Plain JSON has no concept of message type — it’s just a static data representation. These distinctions matter when building robust, asynchronous protocols like MCP.

### 📌 In Summary

| Feature | Plain JSON | JSON-RPC |
| :--- | :---: | :---: |
| Only describes data | ✔ | ✔ |
| Defines call semantics (method, id) | ❌ | ✔ |
| Supports request/response matching | ❌ | ✔ |
| Distinguishes requests vs notifications | ❌ | ✔ |
| Works consistently over multiple transports | ❌ | ✔ |

### 🧠 Bottom Line
MCP uses **JSON-RPC 2.0** because:
- ✅ JSON alone is just the format, not a communication protocol.
- ✅ JSON-RPC defines how requests/responses should work.
- ✅ It adds structure for method calls, IDs, errors, and notifications.
- ✅ It’s a standard that MCP can build on instead of reinventing the communication layer.

**In short: JSON = data. JSON-RPC = defined messaging protocol using JSON.** MCP needs the latter to function consistently between clients and servers.

## 11. 🔄 MCP Lifecycle

The MCP Lifecycle governs how a host and server establish, use, and end a connection. It consists of three main phases: **Initialization**, **Operation**, and **Shutdown**, plus special handling for pings and errors.

### 1. Initialization Phase
This is the three-step handshake to establish a valid connection. Neither side should send operational requests until this succeeds.

#### The Handshake Flow
1.  **Client → Server**: `initialize` request (Protocol version, capabilities).
2.  **Server → Client**: `initialize` response (Protocol version, capabilities, server info).
3.  **Client → Server**: `initialized` notification (Confirmation).

```mermaid
sequenceDiagram
    participant Client
    participant Server
    
    Note over Client, Server: Phase 1: Initialization
    Client->>Server: Request: initialize (v1.0, caps)
    Server-->>Client: Result: initialize (v1.0, caps)
    Client->>Server: Notification: initialized
    Note right of Server: Connection Active
```

**Example: Client Initialize Request**
```json
{
  "jsonrpc": "2.0",
  "id": 0,
  "method": "initialize",
  "params": {
    "protocolVersion": "2023-10-25",
    "capabilities": { "roots": {}, "sampling": {} },
    "implementation": { "name": "Claude-Desktop", "version": "1.0.0" }
  }
}
```

### 2. Operation Phase
Once connected, the actual work happens. This allows for **Capability Discovery** and **Tool Calling**.

#### Capability Discovery
The client automatically asks: "What can you do?"
- Client sends `tool/list`, `resource/list`, `prompt/list`.
- Server responds with the available inventory.

#### Tool Execution
The client invokes a specific tool based on the user's intent.

```mermaid
sequenceDiagram
    participant Client
    participant Server
    
    Note over Client, Server: Phase 2: Operation
    Client->>Server: Request: tool/list
    Server-->>Client: Result: [readFile, listDir, etc.]
    
    Client->>Server: Request: tool/call (name="readFile", args={path="..."})
    Server-->>Client: Result: {content: "File contents..."}
```

### 3. Shutdown Phase
Graceful termination of the session.

- **Local (Stdio)**: Client closes the Input Stream. If the server persists, Client sends `SIGTERM` → `SIGKILL`.
- **Remote (HTTP)**: Client closes the connection.

### 4. Special Cases

#### Pings 🏓
Used to keep connections alive or verify reachability.
```json
{ "jsonrpc": "2.0", "method": "ping", "params": { "id": "abc" } }
```

#### Progress Notifications ⏳
For long-running tasks, the server can report progress if the client provides a `progressToken`.
```json
{
  "jsonrpc": "2.0", 
  "method": "progress", 
  "params": { 
    "progressToken": "token1", 
    "progress": 60, 
    "message": "Processing..." 
  }
}
```

#### Errors ⚠️
Standard JSON-RPC errors are used.
- `-32601`: Method not found.
- `-32602`: Invalid params.

## 12. 🚀 Fast MCP vs. Standard MCP SDK

While the MCP SDK provides the foundational tools (`mcp.server`, `mcp.client`) to build on the protocol, using it directly can be verbose. **Fast MCP** is an abstraction layer (now included in the SDK) designed to simplify this process, much like how **FastAPI** simplifies web development compared to raw WSGI.

### 1. The Challenge with "Normal" MCP SDK
The standard SDK is powerful but low-level. It requires explicit setup for:
- Connection management.
- Request/response handling logic.
- Error catching and protocol compliance.
- **Boilerplate**: A simple tool often requires many lines of setup code.

### 2. The Solution: Fast MCP
Fast MCP wraps the complexity of the lifecycle in a developer-friendly API.

| Feature | Standard MCP SDK | Fast MCP |
| :--- | :--- | :--- |
| **Abstraction Level** | Low-level (Protocol details exposed) | High-level (Focus on logic) |
| **Boilerplate** | High (Verbose setup) | Minimal (Decorators) |
| **Developer Experience** | Complex for beginners | Intuitive, "Pythonic" |
| **Analogy** | Raw WSGI / Servlet | FastAPI / Flask |

### 3. Why Use Fast MCP?
1.  **Developer-Friendly**: Uses Python decorators (`@mcp.tool()`) to instantly turn functions into tools.
2.  **Less Code**: Handles the heavy lifting of initialization, capability negotiation, and error handling automatically.
3.  **FastAPI Inspiration**: If you know FastAPI, you know Fast MCP. It uses type hints for validation and descriptions for documentation.
4.  **Future Standard**: Due to its ease of use, it is becoming the default way to build Python MCP servers.

### 4. Code Comparison

**Standard SDK (Conceptual Boilerplate)**
```python
# Requires manual session handling, read streams, write streams, 
# dispatcher logic, and explicit type checking.
import asyncio
from mcp.server import Server
# ... 50+ lines of setup code ...
```

**Fast MCP (The "Fast" Way)**
```python
from mcp.server.fastmcp import FastMCP

mcp = FastMCP("my-server")

@mcp.tool()
def add(a: int, b: int) -> int:
    """Adds two numbers"""
    return a + b

if __name__ == "__main__":
    mcp.run()
```

## 15. 🔌 Deep Dive: MCP Client

### What Is an MCP Client?

An **MCP Client** is a protocol-level connector embedded *inside* the host application. It is the component that speaks the MCP protocol on behalf of the host — managing the stateful, 1:1 connection to a specific MCP Server. Think of it as the "network card" inside the host computer: the host decides *what* to do, but the client handles *how* to communicate.

> **Key insight**: There is typically **one MCP Client per MCP Server**. A host that connects to three servers will instantiate three separate clients, each managing its own session.

```mermaid
graph TD
    subgraph "MCP Host Application"
        LLM[LLM / AI Model]
        Orchestrator[Orchestration Logic]
        C1[MCP Client 1]
        C2[MCP Client 2]
        C3[MCP Client 3]
        LLM <--> Orchestrator
        Orchestrator --> C1
        Orchestrator --> C2
        Orchestrator --> C3
    end

    C1 -- "JSON-RPC / stdio" --> S1[MCP Server: FileSystem]
    C2 -- "JSON-RPC / SSE" --> S2[MCP Server: Database]
    C3 -- "JSON-RPC / HTTP" --> S3[MCP Server: Web Search]
```

### Core Responsibilities of an MCP Client

| Responsibility | Description |
|---|---|
| **Session Management** | Establishes and maintains a stateful connection with one MCP Server |
| **Capability Negotiation** | During initialization, exchanges supported features with the server |
| **Tool Discovery** | Calls `tools/list` to fetch available tools from the server |
| **Tool Invocation** | Sends `tools/call` requests and returns results to the host |
| **Resource Access** | Calls `resources/list` and `resources/read` for data access |
| **Protocol Compliance** | Ensures all messages conform to JSON-RPC 2.0 format |
| **Error Handling** | Catches and propagates server-side errors back to the host |
| **Transport Abstraction** | Works over stdio (local) or HTTP/SSE (remote) transparently |

### How to Build an MCP Client in Python

Below is a complete, step-by-step guide to building a functional MCP client in Python using the official `mcp` SDK.

#### Step 1: Prerequisites & Installation

```bash
# Requires Python 3.10+
pip install mcp anthropic python-dotenv
```

Create a `.env` file for your API key:
```bash
ANTHROPIC_API_KEY=your_api_key_here
```

#### Step 2: Project Structure

```
my-mcp-client/
├── client.py          # Main MCP client logic
├── .env               # API keys
└── requirements.txt   # Dependencies
```

#### Step 3: Implement the MCP Client Class

```python
import asyncio
import json
from contextlib import AsyncExitStack
from typing import Optional

import anthropic
from dotenv import load_dotenv
from mcp import ClientSession, StdioServerParameters
from mcp.client.stdio import stdio_client

load_dotenv()

class MCPClient:
    """
    A complete MCP Client that:
    1. Connects to an MCP Server via stdio
    2. Discovers available tools
    3. Uses Claude to process user queries
    4. Executes tool calls and returns results
    """

    def __init__(self):
        self.session: Optional[ClientSession] = None
        self.exit_stack = AsyncExitStack()
        # Initialize the Anthropic LLM client
        self.anthropic = anthropic.Anthropic()

    async def connect_to_server(self, server_script_path: str):
        """Connect to an MCP server running as a local subprocess."""
        # Determine if it's a Python or Node.js server
        is_python = server_script_path.endswith(".py")
        command = "python" if is_python else "node"

        # Define how to launch the server process
        server_params = StdioServerParameters(
            command=command,
            args=[server_script_path],
            env=None  # Inherit environment variables
        )

        # Establish the stdio transport and create a session
        stdio_transport = await self.exit_stack.enter_async_context(
            stdio_client(server_params)
        )
        self.stdio, self.write = stdio_transport

        # Create and initialize the MCP ClientSession
        self.session = await self.exit_stack.enter_async_context(
            ClientSession(self.stdio, self.write)
        )

        # Perform the MCP handshake (initialize + initialized)
        await self.session.initialize()

        # Discover available tools from the server
        response = await self.session.list_tools()
        tools = response.tools
        print(f"\n✅ Connected! Available tools: {[t.name for t in tools]}")

    async def process_query(self, query: str) -> str:
        """
        Process a user query:
        1. Send it to Claude with tool definitions
        2. Execute any tool calls Claude requests
        3. Return the final response
        """
        messages = [{"role": "user", "content": query}]

        # Fetch current tool list from the server
        response = await self.session.list_tools()
        # Convert MCP tool format to Anthropic tool format
        available_tools = [
            {
                "name": tool.name,
                "description": tool.description,
                "input_schema": tool.inputSchema,
            }
            for tool in response.tools
        ]

        # Agentic loop: keep calling Claude until no more tool calls
        while True:
            claude_response = self.anthropic.messages.create(
                model="claude-opus-4-5",
                max_tokens=4096,
                tools=available_tools,
                messages=messages,
            )

            # If Claude is done (no tool use), return the final text
            if claude_response.stop_reason == "end_turn":
                return next(
                    block.text
                    for block in claude_response.content
                    if hasattr(block, "text")
                )

            # Process tool calls requested by Claude
            tool_results = []
            for block in claude_response.content:
                if block.type == "tool_use":
                    tool_name = block.name
                    tool_args = block.input
                    print(f"\n🔧 Calling tool: {tool_name} with args: {tool_args}")

                    # Execute the tool via MCP
                    result = await self.session.call_tool(tool_name, tool_args)
                    tool_results.append({
                        "type": "tool_result",
                        "tool_use_id": block.id,
                        "content": result.content,
                    })

            # Append Claude's response and tool results to the conversation
            messages.append({"role": "assistant", "content": claude_response.content})
            messages.append({"role": "user", "content": tool_results})

    async def chat_loop(self):
        """Run an interactive command-line chat session."""
        print("\n🤖 MCP Client Ready! Type 'quit' to exit.\n")
        while True:
            query = input("You: ").strip()
            if query.lower() == "quit":
                break
            if query:
                response = await self.process_query(query)
                print(f"\nAssistant: {response}\n")

    async def cleanup(self):
        """Clean up resources and close connections."""
        await self.exit_stack.aclose()


async def main():
    client = MCPClient()
    try:
        # Connect to your MCP server (e.g., a filesystem server)
        await client.connect_to_server("./server.py")
        await client.chat_loop()
    finally:
        await client.cleanup()


if __name__ == "__main__":
    asyncio.run(main())
```

### Connecting to a Remote Server (HTTP/SSE)

For remote servers, swap `stdio_client` for the SSE transport:

```python
from mcp.client.sse import sse_client

async def connect_to_remote_server(self, server_url: str):
    """Connect to a remote MCP server via HTTP/SSE."""
    sse_transport = await self.exit_stack.enter_async_context(
        sse_client(url=server_url)
    )
    self.stdio, self.write = sse_transport
    self.session = await self.exit_stack.enter_async_context(
        ClientSession(self.stdio, self.write)
    )
    await self.session.initialize()
```

## 16. 🆚 MCP Client vs MCP Host — Key Differences

This is one of the most commonly confused distinctions in the MCP ecosystem. While the **Host** and **Client** work together closely, they have fundamentally different roles, scopes, and responsibilities.

```mermaid
graph TD
    subgraph "What the USER sees"
        UI[User Interface / Chat Window]
    end

    subgraph "MCP HOST — The Application"
        UI --> Orch[Orchestration & Decision Logic]
        Orch --> LLM[LLM / AI Model]
        Orch --> Auth[Auth & Security Policy]
        Orch --> C1[MCP Client 1]
        Orch --> C2[MCP Client 2]
    end

    subgraph "External World"
        C1 -- "JSON-RPC" --> S1[MCP Server A]
        C2 -- "JSON-RPC" --> S2[MCP Server B]
    end

    style UI fill:#d4edda
    style Orch fill:#cce5ff
    style LLM fill:#cce5ff
    style Auth fill:#cce5ff
    style C1 fill:#fff3cd
    style C2 fill:#fff3cd
```

### Side-by-Side Comparison

| Dimension | 🏠 MCP Host | 🔌 MCP Client |
|---|---|---|
| **What it is** | The entire user-facing application | A protocol connector *inside* the host |
| **Scope** | Macro-level: the whole AI app | Micro-level: one server connection |
| **User Visibility** | Directly visible (UI, chat window) | Invisible to the user (internal component) |
| **Relationship to LLM** | Contains and manages the LLM | Does not directly interact with the LLM |
| **Number per app** | One per application | One per MCP Server connected |
| **Responsibilities** | UX, orchestration, security, context window | Protocol compliance, session, tool calls |
| **Decision Making** | Decides *when* and *which* tools to use | Executes the tool call as instructed |
| **Examples** | Claude Desktop, Cursor IDE, custom AI app | Internal connector to a filesystem server |
| **Lifecycle** | Manages the overall app lifecycle | Manages a single server session lifecycle |
| **Security** | Enforces user permissions and policies | Validates server responses |
| **Analogy** | The Operating System | A device driver |

### Mental Model: The Restaurant Analogy 🍽️

Think of an MCP-powered AI application as a restaurant:

- **MCP Host** = The **Restaurant** itself. It manages the overall experience: seating customers (users), taking orders (user queries), coordinating the kitchen, and ensuring food safety standards (security policies).
- **MCP Client** = A **Waiter**. Each waiter handles communication with one specific kitchen station (server). The waiter doesn't decide the menu — they just relay orders accurately and bring back results.
- **MCP Server** = A **Kitchen Station** (grill, salad, dessert). Each station specializes in one thing and responds to orders from its assigned waiter.
- **LLM** = The **Head Chef**. Decides what to cook based on the order, but relies on waiters to communicate with stations.

### When Does the Host Create a Client?

```mermaid
sequenceDiagram
    participant User
    participant Host
    participant Client
    participant Server

    User->>Host: Opens app / starts session
    Host->>Host: Reads config (which servers to connect?)
    Host->>Client: Instantiate Client for Server A
    Client->>Server: initialize handshake
    Server-->>Client: capabilities
    Client-->>Host: "Ready — Server A has tools: X, Y, Z"
    
    User->>Host: "Summarize my emails"
    Host->>Host: LLM decides: use tool Y from Server A
    Host->>Client: Execute tool Y with args
    Client->>Server: tools/call Y {args}
    Server-->>Client: result
    Client-->>Host: result
    Host->>User: "Here is your summary..."
```

### Key Takeaway

> **The Host is the brain; the Client is the nervous system.** The host makes decisions, manages the user experience, and coordinates everything. The client is a focused, stateful connector that handles the low-level protocol work of talking to one specific server. You cannot have a client without a host, but a host can have many clients.
